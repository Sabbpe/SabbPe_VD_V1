version: '3.8'

services:
  # Local PostgreSQL for testing (optional)
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: valuedesign_test
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Redis for caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Backend application
  backend:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - VD_DISTRIBUTOR_ID=${VD_DISTRIBUTOR_ID}
      - VD_API_USERNAME=${VD_API_USERNAME}
      - VD_API_PASSWORD=${VD_API_PASSWORD}
      - VD_SECRET_KEY=${VD_SECRET_KEY}
      - VD_SECRET_IV=${VD_SECRET_IV}
      - VD_API_BASE_URL=${VD_API_BASE_URL}
      - SABBPE_API_KEY=${SABBPE_API_KEY}
      - SABBPE_API_SECRET=${SABBPE_API_SECRET}
      - SABBPE_API_BASE_URL=${SABBPE_API_BASE_URL}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data: